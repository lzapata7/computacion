version: 2.1
orbs:
  python: circleci/python@2.1.1
jobs:
  test:
    docker:
      - image: cimg/python:3.11
    steps:
      - checkout
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt flake8
      - run: flake8 backgammon
      - run: pytest --cov=backgammon/core --cov-report=term-missing
workflows:
  test:
    jobs:
      - test